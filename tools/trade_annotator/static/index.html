<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trade Annotator — Kripta Studios</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
<div class="app-container">
    <!-- Top Bar -->
    <div class="topbar">
        <div class="topbar-title">TRADE ANNOTATOR</div>
        <div class="topbar-divider"></div>

        <select id="tickerSelect">
            <option value="SPX">SPX</option>
            <option value="QQQ">QQQ</option>
        </select>

        <input type="date" id="dateInput" />

        <button class="btn btn-icon" id="prevDay" title="Previous day">◀</button>
        <button class="btn btn-icon" id="nextDay" title="Next day">▶</button>

        <div class="topbar-divider"></div>

        <button class="btn" id="annotateBtn">✏ Annotate Trade</button>
        <button class="btn btn-success" id="saveBtn">💾 Save</button>

        <div class="topbar-spacer"></div>

        <div class="topbar-info" id="summaryInfo">Loading...</div>
    </div>

    <!-- Main Area -->
    <div class="main-area">
        <!-- Chart -->
        <div class="chart-container">
            <div id="chart"></div>
            <div class="chart-loading" id="chartLoading">
                <div class="spinner"></div>
                <span>Select a date to load chart data</span>
            </div>
            <div class="annotation-banner" id="annotationBanner">
                Click on the chart to set <strong id="annotationStep">entry</strong> point — Press ESC to cancel
            </div>
        </div>

        <!-- Side Panel -->
        <div class="side-panel">
            <!-- Levels Section -->
            <div class="panel-section">
                <div class="panel-section-header">
                    <span>Overlays</span>
                </div>
                <div class="panel-section-body" id="levelsPanel">
                    <!-- IB -->
                    <div class="level-toggle">
                        <input type="checkbox" id="lvl_ib" checked data-level="ib">
                        <span class="level-swatch" style="background:#3b82f6"></span>
                        <label for="lvl_ib">IB High / Low</label>
                    </div>
                    <div class="level-toggle">
                        <input type="checkbox" id="lvl_fib" checked data-level="fib">
                        <span class="level-swatch" style="background:#f59e0b;opacity:0.6"></span>
                        <label for="lvl_fib">Fibonacci Extensions</label>
                    </div>
                    <!-- Greek levels -->
                    <div class="level-toggle">
                        <input type="checkbox" id="lvl_gamma" checked data-level="gamma">
                        <span class="level-swatch" style="background:#ef4444"></span>
                        <label for="lvl_gamma">Max/Min Gamma</label>
                    </div>
                    <div class="level-toggle">
                        <input type="checkbox" id="lvl_vanna" data-level="vanna">
                        <span class="level-swatch" style="background:#8b5cf6"></span>
                        <label for="lvl_vanna">Max/Min Vanna</label>
                    </div>
                    <div class="level-toggle">
                        <input type="checkbox" id="lvl_dgex" data-level="dgex">
                        <span class="level-swatch" style="background:#06b6d4"></span>
                        <label for="lvl_dgex">Max/Min DGEX</label>
                    </div>
                    <div class="level-toggle">
                        <input type="checkbox" id="lvl_zerogamma" data-level="zerogamma">
                        <span class="level-swatch" style="background:#f97316"></span>
                        <label for="lvl_zerogamma">Zero Gamma</label>
                    </div>
                    <div class="level-toggle">
                        <input type="checkbox" id="lvl_vega" data-level="vega">
                        <span class="level-swatch" style="background:#ec4899"></span>
                        <label for="lvl_vega">Max/Min Vega</label>
                    </div>
                    <div class="level-toggle">
                        <input type="checkbox" id="lvl_vomma" data-level="vomma">
                        <span class="level-swatch" style="background:#14b8a6"></span>
                        <label for="lvl_vomma">Max/Min Vomma</label>
                    </div>
                </div>
            </div>

            <!-- Trades Section -->
            <div class="panel-section" style="flex:1;display:flex;flex-direction:column;overflow:hidden;">
                <div class="panel-section-header">
                    <span>Trades (<span id="tradeCount">0</span>)</span>
                </div>
                <div class="trades-scroll" id="tradesPanel">
                    <div class="no-trades">No trades for this day</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Status Bar -->
    <div class="statusbar">
        <span><span class="dot green"></span> Connected</span>
        <span id="statusText">Ready</span>
    </div>
</div>

<!-- Trade Confirm Dialog -->
<div class="modal-backdrop" id="tradeModal">
    <div class="modal">
        <h3>Confirm Trade Annotation</h3>
        <div class="modal-row">
            <label>Entry:</label>
            <span class="value" id="modalEntry">—</span>
        </div>
        <div class="modal-row">
            <label>Exit:</label>
            <span class="value" id="modalExit">—</span>
        </div>
        <div class="modal-row">
            <label>Direction:</label>
            <div class="direction-select">
                <button class="direction-btn long" id="dirLong" onclick="selectDirection(1)">LONG</button>
                <button class="direction-btn short" id="dirShort" onclick="selectDirection(-1)">SHORT</button>
            </div>
        </div>
        <div class="modal-actions">
            <button class="btn" onclick="cancelAnnotation()">Cancel</button>
            <button class="btn btn-primary" onclick="confirmAnnotation()">Add Trade</button>
        </div>
    </div>
</div>

<!-- Toast Container -->
<div class="toast-container" id="toastContainer"></div>

<script src="/static/app.js"></script>
</body>
</html>
