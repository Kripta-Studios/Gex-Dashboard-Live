<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>GEX Dashboard Pro - Login</title>

    <!-- External Libraries -->
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;700&display=swap"
        rel="stylesheet">

    <!-- Modular CSS -->
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="zen-controls-bottom">
        <button class="zen-float-btn" onclick="realignAllCharts()">CENTER ALL</button>
        <button class="zen-float-btn" onclick="takeSnapshot()">📸</button>
        <button class="zen-float-btn" onclick="toggleZenMode()">EXIT ZEN MODE</button>
    </div>
    <div id="login-screen">
        <div class="login-card">
            <div class="login-title">GEX DASHBOARD</div>

            <div class="login-input-group">
                <label class="login-label">Email</label>
                <input type="email" id="login-email" class="login-input" placeholder="user@email.com">
            </div>

            <div class="login-input-group">
                <label class="login-label">Password</label>
                <input type="password" id="login-pass" class="login-input" placeholder="••••••••">
            </div>

            <div id="login-error" class="login-error"></div>

            <button class="login-btn" onclick="checkLogin()">AUTHENTICATE</button>
        </div>
    </div>

    <div id="app-wrapper" style="display: none;">
        <div class="global-time-monitor">
            <div class="market-item">
                <span class="market-label" id="data-time-label">LIVE DATA</span>
                <span class="market-price" id="last-data-time">--:--</span>
            </div>
            <div class="separator"></div>
            <div class="market-item">
                <span class="market-label">NY TIME</span>
                <span class="market-price" id="ny-time">--:--</span>
            </div>
        </div>

        <div class="tab-container" id="tab-container">
            <button class="new-tab-btn" onclick="addNewTab()">+</button>
        </div>
        <div class="main-content">
            <!-- Flex Container to hold middle panel and right panel -->
            <div style="display: flex; width: 100%; height: 100%; overflow: hidden; gap: 15px;">

                <!-- Left/Center Area: existing charts wrapper -->
                <div style="flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0;">
                    <div class="top-bar">
                        <div class="control-panel">
                            <input type="date" id="fourier-date" style="width: 110px; font-weight:700;"
                                title="Date for Fourier Analysis">

                            <button onclick="handleLoadFourier()"
                                style="background: var(--accent-red); color: white;">FOURIER</button>
                            <button id="btn-ib" onclick="handleLoadIB()"
                                style="background: #FFD700; color: black; display: none; font-weight:bold; margin-left:5px;">IB</button>
                            <button id="btn-toggle-ms" onclick="toggleMarketStructurePanel()"
                                style="background: #9400D3; color: white; display: none; font-weight:bold; margin-left:5px;"
                                title="Toggle Market Structure Engine">MS ENGINE</button>
                            <button id="btn-toggle-bot" onclick="toggleBotStatusPanel()"
                                style="background: #20b2aa; color: white; display: none; font-weight:bold; margin-left:5px;"
                                title="Toggle Live Bot Status">BOT STATUS</button>
                            <button id="btn-chart" onclick="handleLoadPriceChart()"
                                style="background: #1E90FF; color: white; display: none; font-weight:bold; margin-left:5px;"
                                title="Load Price Chart (No IB Levels)">CHART</button>
                            <input type="text" id="ticker" value="SPX" placeholder="Ticker" list="ticker-list"
                                oninput="updateExpSuggestions()" style="width: 70px; font-weight:700;">
                            <datalist id="ticker-list">
                                <option value="SPX">
                                <option value="QQQ">
                                <option value="SPY">
                                <option value="IWM">
                                <option value="VIX">
                                <option value="/ES">
                                <option value="/NQ">
                                <option value="ES">
                                <option value="NQ">
                                <option value="AAPL">
                                <option value="AMZN">
                                <option value="MSFT">
                                <option value="GOOGL">
                                <option value="META">
                                <option value="NVDA">
                                <option value="AMD">
                                <option value="TSLA">
                                <option value="NFLX">
                                <option value="PLTR">
                                <option value="HOOD">
                                <option value="MSTR">
                                <option value="HIMS">
                                <option value="UNH">
                                <option value="GLD">
                                <option value="SLV">
                            </datalist>

                            <input type="text" id="exp" value="0dte" placeholder="Exp" list="exp-list"
                                style="width: 60px; font-weight:700;">
                            <datalist id="exp-list"></datalist>

                            <select id="greek-select" style="font-weight:700;">
                                <option value="gamma">Gamma</option>
                                <option value="delta">Delta</option>
                                <option value="vanna">Vanna</option>
                                <option value="charm">Charm</option>
                                <option value="zomma">Zomma</option>
                                <option value="dgex">Dgex</option>
                                <option value="vega">Vega</option>
                                <option value="vomma">Vomma</option>
                                <option value="speed">Speed</option>
                            </select>

                            <button onclick="handleLoadData()">LOAD</button>
                            <button class="btn-add" onclick="handleAddChart()">+</button>

                            <select onchange="changePalette(this.value)" style="width:80px;" title="Theme">
                                <option value="default">Default</option>
                                <option value="palette-alt">Blue/Org</option>
                            </select>

                            <button class="btn-icon" onclick="realignAllCharts()" title="Realign All to Spot">CENTER
                                ALL</button>
                            <button class="btn-icon" onclick="takeSnapshot()" title="Save Image">📸</button>
                            <button class="btn-icon" onclick="toggleZenMode()" title="Zen Mode">🧘</button>
                            <button class="btn-icon" onclick="popoutCurrentLayout()" title="Pop out Layout">⇱</button>
                            <button onclick="saveAllLayouts()" style="background:#333; color:#ccc;">SAVE</button>

                            <label class="checkbox-wrapper">
                                <input type="checkbox" id="auto-refresh" onchange="toggleAutoRefresh()" checked>
                                AUTO
                                <span id="timer-indicator"
                                    style="width: 6px; height: 6px; background: var(--accent-green); border-radius: 50%; display: none;"></span>
                            </label>
                        </div>

                        <div class="control-panel market-monitor">
                            <div class="market-item">
                                <div style="display:flex; justify-content:space-between;">
                                    <span class="market-label">SPX SPOT</span>
                                </div>
                                <div class="price-group">
                                    <span class="market-price" id="spot-spx">----.--</span>
                                    <span class="market-change" id="change-spx"></span>
                                </div>
                            </div>
                            <div style="width: 1px; height: 30px; background: var(--border);"></div>
                            <div class="market-item">
                                <span class="market-label">VIX SPOT</span>
                                <div class="price-group">
                                    <span class="market-price" id="spot-vix">--.--</span>
                                    <span class="market-change" id="change-vix"></span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div id="charts-wrapper" ondragover="handleWrapperDragOver(event)"
                        style="flex: 1; overflow: auto; padding-right: 10px; padding-bottom: 20px;">
                        <div
                            style="width:100%; text-align:center; padding-top:100px; color:var(--text-dim); font-size: 14px;">
                            No charts loaded.
                        </div>
                    </div>

                    <div id="time-machine-panel">
                        <button style="background:transparent; border:none; color:var(--text-dim); cursor:pointer;"
                            onclick="playHistory()">▶</button>
                        <button id="btn-history-load" onclick="loadHistoryNow()"
                            style="margin: 0 5px; background: var(--accent-blue); border: none; color: white; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 4px; cursor: pointer;"
                            title="Load Data for Selected Time">GO</button>
                        <button onclick="goLive()"
                            style="margin: 0 10px; background: var(--panel-bg); border: 1px solid var(--accent-green); color: var(--accent-green); font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 4px; cursor: pointer;">GO
                            LIVE</button>
                        <div style="font-size:9px; color:var(--text-dim); width:60px;">HISTORY</div>
                        <input type="range" id="history-slider" min="0" max="100" value="100"
                            oninput="scrubHistory(this.value)">
                        <div style="text-align:right; width:80px;">
                            <div style="font-size:9px; color:var(--text-dim);">DATA TIME</div>
                            <div id="history-time"
                                style="font-family:'Roboto Mono'; font-weight:700; color:var(--accent-green); font-size:12px;">
                                LIVE</div>
                        </div>
                    </div>

                </div> <!-- End Left/Center Area -->

                <!-- Right Area: Market Structure Engine Panel (Hidden by default, requires ADMIN) -->
                <div id="market-structure-panel" class="ms-panel" style="display:none;">
                    <div class="ms-header">
                        <span>MARKET STRUCTURE</span>
                        <button class="ms-close-btn" onclick="toggleMarketStructurePanel()"
                            title="Hide Panel">×</button>
                    </div>
                    <div class="ms-content">
                        <div id="ms-warning" class="ms-warning" style="display:none;"></div>
                        <div id="ms-structure-name" class="ms-title">Awaiting Data...</div>
                        <div id="ms-dealer-action" class="ms-subtitle"></div>

                        <div class="ms-tilt-container">
                            <span id="ms-tilt-tag" class="ms-tilt"></span>
                        </div>

                        <div class="ms-cause-container">
                            <div class="ms-cause-title">Structure Condition Match</div>
                            <div id="ms-cause-list" class="ms-cause-list">
                                <!-- Logic injected here -->
                            </div>
                        </div>

                        <div id="ms-flags-container" class="ms-flags">
                            <!-- Badges injected here -->
                        </div>

                        <div class="ms-cause-container" style="margin-top:8px;">
                            <div class="ms-cause-title">Trading Details</div>
                            <div id="ms-details-container" class="ms-details-grid">
                                <!-- Details injected here -->
                            </div>
                        </div>
                    </div>
                </div> <!-- End Right Area -->

                <!-- Right Area: Bot Status Panel (Hidden by default, requires ADMIN) -->
                <div id="bot-status-panel" class="ms-panel" style="display:none; width: 320px;">
                    <div class="ms-header" style="background: var(--panel-bg); border-bottom: 2px solid #20b2aa;">
                        <span style="color: #20b2aa;">LIVE BOT STATUS</span>
                        <button class="ms-close-btn" onclick="toggleBotStatusPanel()"
                            title="Hide Panel">×</button>
                    </div>
                    <div class="ms-content" id="bot-status-content" style="overflow-y: auto;">
                        <div class="ms-title" style="text-align:center; padding: 20px; color: var(--text-dim);">Awaiting Bot Data...</div>
                    </div>
                </div>

            </div> <!-- End Flex Container -->

        </div>
    </div>

    </div>

    <!-- 
    ============================================
    MODULAR JAVASCRIPT - Load Order Matters!
    ============================================
    The scripts below are loaded in dependency order.
    Each module contains specific functionality.
    -->

    <!-- 1. State - Global variables (must be first) -->
    <script src="js/state.js"></script>

    <!-- 2. API - Data fetching functions -->
    <script src="js/api.js"></script>

    <!-- 3. UI - User interface helpers -->
    <script src="js/ui.js"></script>

    <!-- 4. Tabs - Tab management -->
    <script src="js/tabs.js"></script>

    <!-- 5. Drag & Drop - Panel reordering -->
    <script src="js/dragdrop.js"></script>

    <!-- 6. Dashboard - Core rendering logic (Public) -->
    <script src="js/dashboard.js"></script>

    <!-- 7. Heatmap - Greek exposure heatmaps -->
    <script src="js/heatmap.js"></script>

    <!-- 8. Scripts below are loaded dynamically by auth.js for ADMINs only -->
    <!-- js/fourier.js, js/ib.js, js/charts.js, js/market_structure.js -->

    <!-- 10. Handlers - Form handling -->
    <script src="js/handlers.js"></script>

    <!-- 11. History - Time machine controls -->
    <script src="js/history.js"></script>

    <!-- 12. Layout - Save/load layouts -->
    <script src="js/layout.js"></script>

    <!-- 13. Refresh - Dashboard refresh -->
    <script src="js/refresh.js"></script>

    <!-- 14. Windows - Detached windows -->
    <script src="js/windows.js"></script>

    <!-- 15. Auth - Authentication -->
    <script src="js/auth.js"></script>

    <!-- 16. Init - Application initialization -->
    <script src="js/init.js"></script>

    <!-- 17. Engine - Market Structure Engine (must be last to ensure API is ready) -->
    <script src="js/market_structure.js"></script>

</body>

</html>
