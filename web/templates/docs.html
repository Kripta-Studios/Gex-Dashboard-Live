<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>GEX Dashboard Pro - Documentation</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
    
    <style>
        /* PDF specific layout */
        body { font-family: 'Inter', sans-serif; background-color: #0b0e14; color: #fff; margin:0; padding:0; overflow:hidden; }
        
        #docs-wrapper {
            display: none; /* Shown after auth */
            width: 100vw;
            height: 100vh;
            flex-direction: row;
        }

        .pdf-sidebar {
            width: 300px;
            background: #141822;
            border-right: 1px solid #2a2e39;
            display: flex;
            flex-direction: column;
            padding: 15px;
            overflow-y: auto;
        }

        .pdf-main {
            flex: 1;
            background: #000;
            display: flex;
        }

        .sidebar-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--accent-blue, #1E90FF);
            margin-bottom: 20px;
            letter-spacing: 1px;
            border-bottom: 1px solid #2a2e39;
            padding-bottom: 10px;
        }

        .pdf-folder {
            margin-bottom: 15px;
        }
        .pdf-folder-title {
            font-size: 11px;
            font-weight: 700;
            color: #8c92a4;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .pdf-item {
            font-size: 13px;
            color: #d1d5db;
            cursor: pointer;
            padding: 8px 10px;
            border-radius: 4px;
            transition: all 0.2s;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .pdf-item:hover {
            background: #2a2e39;
            color: #fff;
        }

        .pdf-item.active {
            background: #1E90FF;
            color: #fff;
            font-weight: 600;
        }
        
        .top-nav {
            position: absolute;
            top: 15px;
            right: 20px;
        }
        
        .btn-back {
            background: #333;
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
            font-size: 12px;
        }
        .btn-back:hover { background: #444; }
    </style>
</head>

<body>
    <!-- LOGIN SCREEN -->
    <div id="login-screen">
        <div class="login-card">
            <div class="login-title">GEX DASHBOARD - DOCS</div>
            <div class="login-input-group">
                <label class="login-label">Email</label>
                <input type="email" id="login-email" class="login-input" placeholder="user@email.com">
            </div>
            <div class="login-input-group">
                <label class="login-label">Password</label>
                <input type="password" id="login-pass" class="login-input" placeholder="••••••••">
            </div>
            <div id="login-error" class="login-error"></div>
            <button class="login-btn" onclick="checkLogin()">AUTHENTICATE</button>
        </div>
    </div>

    <!-- DOCS UI -->
    <div id="docs-wrapper">
        <div class="pdf-sidebar">
            <div class="sidebar-title">DOCUMENTATION</div>
            <div id="pdf-list-container">
                <div style="color:#aaa; font-size:12px;">Loading PDFs...</div>
            </div>
        </div>
        <div class="pdf-main">
            <iframe id="pdf-viewer" src="" style="width:100%; height:100%; border:none;" title="PDF Viewer"></iframe>
        </div>
        <div class="top-nav">
            <a href="/" class="btn-back">⬅ DASHBOARD</a>
        </div>
    </div>

    <!-- Scripts -->
    <script src="/js/auth.js"></script>
    <script>
        // Override grantAccess for docs.html
        window.grantAccess = function(role) {
            if (role !== "ADMIN") {
                document.getElementById("login-error").innerText = "Access denied. ADMIN role required.";
                return;
            }
            
            // Show UI
            document.getElementById("login-screen").style.display = "none";
            document.getElementById("docs-wrapper").style.display = "flex";
            
            // Load PDFs
            fetchPDFs();
        };

        // Initialize: Auto-login if token exists
        window.onload = function() {
            const token = sessionStorage.getItem("gex_auth_token");
            if (token) {
                fetch("/verify_token", {
                    headers: { "Authorization": "Bearer " + token }
                })
                .then(r => r.json())
                .then(data => {
                    if (data.status === "ok") {
                        if (data.role === "ADMIN") {
                            grantAccess(data.role);
                        } else {
                            document.getElementById("login-error").innerText = "Access denied. ADMIN role required.";
                            sessionStorage.removeItem("gex_auth_token"); // Force logout of docs
                        }
                    }
                }).catch(e => console.error(e));
            }
        };

        async function fetchPDFs() {
            const token = sessionStorage.getItem("gex_auth_token");
            try {
                const res = await fetch("/api/pdfs/list", {
                    headers: { "Authorization": "Bearer " + token }
                });
                
                if (!res.ok) {
                    document.getElementById("pdf-list-container").innerHTML = "<div style='color:red;'>Failed to load PDFs</div>";
                    return;
                }
                
                const files = await res.json();
                renderPDFList(files);
            } catch (e) {
                console.error(e);
            }
        }

        function renderPDFList(files) {
            const container = document.getElementById("pdf-list-container");
            container.innerHTML = "";
            
            if (files.length === 0) {
                container.innerHTML = "<div style='color:#aaa; font-size:12px;'>No PDFs found.</div>";
                return;
            }

            // Group by folder
            const groups = {};
            files.forEach(f => {
                const parts = f.split("/");
                const folder = parts.length > 1 ? parts[0].toUpperCase() : "ROOT";
                if (!groups[folder]) groups[folder] = [];
                groups[folder].push(f);
            });

            for (const folder in groups) {
                const folderDiv = document.createElement("div");
                folderDiv.className = "pdf-folder";
                
                const titleDiv = document.createElement("div");
                titleDiv.className = "pdf-folder-title";
                titleDiv.innerText = folder;
                folderDiv.appendChild(titleDiv);

                groups[folder].forEach(filePath => {
                    const item = document.createElement("div");
                    item.className = "pdf-item";
                    item.innerText = filePath.split("/").pop(); // Show just filename
                    item.title = filePath;
                    
                    item.onclick = function() {
                        document.querySelectorAll(".pdf-item").forEach(i => i.classList.remove("active"));
                        item.classList.add("active");
                        loadPDF(filePath);
                    };
                    
                    folderDiv.appendChild(item);
                });

                container.appendChild(folderDiv);
            }
        }

        function loadPDF(filePath) {
            const token = sessionStorage.getItem("gex_auth_token");
            const iframe = document.getElementById("pdf-viewer");
            iframe.src = "/api/pdfs/serve?file=" + encodeURIComponent(filePath) + "&token=" + encodeURIComponent(token);
        }
    </script>
</body>
</html>
